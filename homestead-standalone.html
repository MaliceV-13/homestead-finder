/* ===== dark field-app theme (hunt-map look) ===== */

.sp{background:var(--panel);color:var(--tx)}.sp.game{background:#4a3416;color:#ffd9a8}

html.light{--bg:#f7f7f4;--panel:#ffffff;--line:#d9dcd6;--tx:#1b1f22;--mut:#5f6a70;--acc:#e07a12;--ok:#2e7d32}

.yield{opacity:.6}.yield>*{transform:scale(.4)}.yield .glab,.yield .flab,.yield .pricepin{visibility:hidden}

.dim{opacity:.5}.dim>*{transform:scale(.8)}.clustered,.solohide{display:none!important}
.cnt{position:absolute;top:-6px;right:-10px;background:#111;color:#fff;border:2px solid var(--acc);font:700 11px system-ui;border-radius:10px;padding:0 5px;min-width:18px;text-align:center}
.lpin,.gamepin,.fishpin{position:relative}

#home{position:fixed;inset:0;z-index:30;background:var(--bg);color:var(--tx);overflow:auto;padding:calc(env(safe-area-inset-top) + 16px) 16px 24px}

/* Google-like default style */

<script>window.HF_STANDALONE=1;
'use strict';
/* Homestead Finder – vanilla JS PWA */

function geomFor(t,p){if(!p.length)return null;

 for(let i=0;i<=N;i++){let d=total*i/N,k=1;while(k<pts.length-1&&hav(pts[0],pts[0])+len(pts.slice(0,k+1))<d)k++;const s0=len(pts.slice(0,k)),seg=hav(pts[k-1],pts[k])||1,f=Math.min(1,Math.max(0,(d-s0)/seg));const p=[pts[k-1][0]+(pts[k][0]-pts[k-1][0])*f,pts[k-1][1]+(pts[k][1]-pts[k-1][1])*f];let e=null;try{e=map.queryTerrainElevation(p,{exaggerated:false})}catch(x){}samples.push(e)}

 c.classList.remove('hidden');c.width=c.clientWidth*2;c.height=160;const x=c.getContext('2d'),mn=Math.min(...samples),mx=Math.max(...samples),r=mx-mn||1;
 x.clearRect(0,0,c.width,c.height);x.beginPath();samples.forEach((v,i)=>{const X=i/N*c.width,Y=150-(v-mn)/r*130;i?x.lineTo(X,Y):x.moveTo(X,Y)});x.strokeStyle='#2f5d3a';x.lineWidth=4;x.stroke();
 x.fillStyle='#000';x.font='22px sans-serif';x.fillText(`${Math.round(mx*3.28084)} ft`,4,22);x.fillText(`${Math.round(mn*3.28084)} ft  · gain ${Math.round(samples.reduce((s,v,i)=>i&&v>samples[i-1]?s+v-samples[i-1]:s,0)*3.28084)} ft`,4,154)}

/* ================= Water access ================= */
const _waterCache=new Map();
function loadWater(lon,lat){const k=lon.toFixed(4)+','+lat.toFixed(4);if(_waterCache.has(k))return _waterCache.get(k);
 const p=(async()=>{const q=`(way["natural"="water"](around:3200,${lat},${lon});relation["natural"="water"](around:3200,${lat},${lon});way["waterway"~"^(river|stream|creek|canal|brook)$"](around:3200,${lat},${lon});nwr["leisure"="slipway"](around:16000,${lat},${lon});nwr["leisure"="fishing"](around:16000,${lat},${lon});nwr["fishing"~"yes|designated"](around:16000,${lat},${lon}););out geom center 300;`;
  const nwis=`https://waterservices.usgs.gov/nwis/site/?format=rdb&siteType=GW&siteStatus=all&bBox=${(lon-.05).toFixed(4)},${(lat-.04).toFixed(4)},${(lon+.05).toFixed(4)},${(lat+.04).toFixed(4)}`;
  const [ov,wl]=await Promise.all([overpass(q).catch(()=>null),getText(nwis).catch(e=>String(e.message).includes('404')?'':null)]);
  const W={ok:!!ov,surf:[],access:[],wells:wl==null?null:wl===''?0:Math.max(0,wl.split('\n').filter(r=>r&&!r.startsWith('#')).length-2)};
  if(ov){const me=[lon,lat];ov.elements.forEach(e=>{const t=e.tags||{};let d=null;
    if(e.type==='way'&&e.geometry){d=t.natural==='water'&&inRing(me,e.geometry.map(g=>[g.lon,g.lat]))?0:distToLine(me,e.geometry.map(g=>[g.lon,g.lat]))}
    else if(e.type==='relation'&&e.members){let best=1e9;e.members.forEach(m=>{if(m.geometry){const r=m.geometry.map(g=>[g.lon,g.lat]);best=Math.min(best,m.role==='outer'&&inRing(me,r)?0:distToLine(me,r))}});d=best<1e9?best:null}
    else{const pt=elPt(e);if(pt)d=hav(me,pt)}
    if(d==null)return;
    if(t.leisure==='slipway'||t.leisure==='fishing'||t.fishing)W.access.push({name:t.name||'',kind:t.leisure==='slipway'?'boat ramp':'fishing access',d});
    else{const kind=t.waterway||(t.water==='pond'||t.water==='reservoir'||t.water==='river'||t.water==='lake'?t.water:t.water||'lake/pond');W.surf.push({name:t.name||'',kind,d})}});
   W.surf.sort((a,b)=>a.d-b.d);W.access.sort((a,b)=>a.d-b.d)}
  return W})();_waterCache.set(k,p);p.catch(()=>_waterCache.delete(k));return p}
function locM(o,p){const k=Math.cos(o[1]*Math.PI/180)*111320;return[(p[0]-o[0])*k,(p[1]-o[1])*110540]}
function distToLine(pt,coords){let best=1e12;for(let i=0;i<coords.length;i++){const a=locM(pt,coords[i]),b=locM(pt,coords[Math.min(i+1,coords.length-1)]);const dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy;let t=L?-(a[0]*dx+a[1]*dy)/L:0;t=Math.max(0,Math.min(1,t));const x=a[0]+t*dx,y=a[1]+t*dy;best=Math.min(best,Math.hypot(x,y))}return best}
function nearestOnCoords(pt,coords){let best=null,bd=1e12;for(let i=0;i<coords.length-1;i++){const a=locM(pt,coords[i]),b=locM(pt,coords[i+1]);const dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy;let t=L?-(a[0]*dx+a[1]*dy)/L:0;t=Math.max(0,Math.min(1,t));const d=Math.hypot(a[0]+t*dx,a[1]+t*dy);if(d<bd){bd=d;best=[coords[i][0]+t*(coords[i+1][0]-coords[i][0]),coords[i][1]+t*(coords[i+1][1]-coords[i][1])]}}return{d:bd,p:best}}
function inRing(p,r){let c=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const a=r[i],b=r[j];if((a[1]>p[1])!==(b[1]>p[1])&&p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function waterHTML(W,st){const sname=(STATES.find(s=>s[0]===st)||[])[1]||'your state';
 const row=x=>`<div class="small">${x.d<30?'📍 <b>on/at this spot</b>':fmtMi(x.d)} – ${x.name?'<b>'+esc(x.name)+'</b>':'unnamed'} <span class="src">(${esc(x.kind)})</span></div>`;
 const dedupe=a=>{const seen=new Set();return a.filter(x=>{const k=(x.name||x.kind)+Math.round(x.d/200);if(seen.has(k))return false;seen.add(k);return true})};
 return `<b>Surface water within 2 mi</b>${!W.ok?'<div class="small">Unknown – OpenStreetMap/Overpass unreachable.</div>':W.surf.length?dedupe(W.surf).slice(0,8).map(row).join(''):'<div class="small">No creeks, rivers, lakes or ponds mapped in OSM within ~2 mi (small ponds/seasonal creeks are often unmapped).</div>'}
 <b>Public water access (10 mi)</b>${!W.ok?'<div class="small">Unknown</div>':W.access.length?dedupe(W.access).slice(0,5).map(row).join(''):'<div class="small">No boat ramps or fishing access mapped within ~10 mi.</div>'}
 <div><b>Wells:</b> ${W.wells==null?'unknown (USGS NWIS unreachable)':W.wells?W.wells+' USGS groundwater sites within ~3 mi':'no USGS groundwater sites within ~3 mi (check state well logs)'}</div>
 <div><b>Irrigation / water rights:</b> <i>unknown</i> – there is no national dataset. Search “${esc(sname)} water rights” (state engineer / water resources agency) and ask the seller what rights convey.</div>
 <div class="src">OpenStreetMap via Overpass (waterways, natural=water, leisure=slipway/fishing) · USGS NWIS. USGS NHD not queried (service too slow for mobile).</div>`}

/* ================= Priorities / weighted fit score ================= */
const FACTORS=[['remote','Solitude / remoteness'],['road','Road access'],['water','Water access'],['public','Public hunting land nearby'],['game','Game diversity'],['flood','Flood risk'],['fire','Fire risk'],['hospital','Distance to hospital'],['power','Power'],['slope','Slope / buildability'],['noise','Noise']];
const PRESETS={Balanced:{remote:3,road:3,water:3,public:3,game:3,flood:3,fire:3,hospital:3,power:3,slope:3,noise:3},
 'Remote hunter':{remote:5,road:2,water:3,public:5,game:5,flood:2,fire:2,hospital:1,power:1,slope:2,noise:4},
 'Family-friendly':{remote:1,road:5,water:3,public:2,game:2,flood:5,fire:4,hospital:5,power:5,slope:4,noise:3}};
settings.prio=settings.prio||{...PRESETS.Balanced};
function computeScore(F){let num=0,den=0;const parts=[];FACTORS.forEach(([k,n])=>{const w=+settings.prio[k]||0;const f=F[k];
  if(f==null){parts.push(`${n}: unknown (weight ${w}, ignored)`);return}if(!w){parts.push(`${n}: ${f.v>0?'+':''}${f.v.toFixed(2)} × weight 0 (off)`);return}
  num+=w*f.v;den+=w;parts.push(`${n}: ${f.v>0?'+':''}${f.v.toFixed(2)} × weight ${w} – ${f.why}`)});
 return{score:den?Math.round(50+50*num/den):50,parts}}
function scoreReport(R){const pros=[],cons=[],warn=[],F={};const mi=d=>d/1609.344;const fv=(k,v,why)=>F[k]={v:Math.max(-1,Math.min(1,v)),why};
 if(R.town===undefined)F.remote=null;else{const d=R.town?mi(R.town.d):99;
  if(d>15){fv('remote',1,'>15 mi to a town');pros.push(`Remote: nearest town ${R.town?esc(R.town.name)+' '+fmtMi(R.town.d):'> 37 mi'}`)}else if(d>5){fv('remote',0.4,'5–15 mi to a town');pros.push(`Nearest town ${esc(R.town.name)} – ${fmtMi(R.town.d)}`)}else{fv('remote',-0.6,'within 5 mi of a town');cons.push(`Close to town (${esc(R.town.name)}, ${fmtMi(R.town.d)}) – more people, less solitude`)}}
 if(R.pad==null)F.public=null;else{const open=R.pad.filter(p=>/OA|RA/.test(p.Pub_Access||''));
  if(open.length){fv('public',Math.min(1,0.4+open.length*0.15),`${open.length} public-access area(s) within 5 mi`);pros.push('Public land within ~5 mi: '+open.slice(0,5).map(p=>`${esc(p.Unit_Nm)} (${esc(p.MngNm_Desc)}, ${p.Pub_Access==='OA'?'open':'restricted'} access)`).join('; '))}else{fv('public',-0.5,'no public-access land within 5 mi');cons.push('No public-access land (PAD-US) within ~5 mi')}}
 if(R.game==null)F.game=null;else{const n=R.game.length;fv('game',n>=6?1:n>=3?0.5:n?0.2:-0.5,`${n} game species within 15 km`);(n?pros:cons).push(n?`Game species recorded: ${R.game.map(t=>esc(t.preferred_common_name)).join(', ')}`:'No game species recorded on iNaturalist nearby (could be under-reported)')}
 if(R.road===undefined){F.road=null;warn.push('Road access unknown (OSM unreachable)')}else if(!R.road){fv('road',-1,'no mapped road within 400 m');warn.push('No mapped road within ~1/4 mi – possibly <b>landlocked</b>. Confirm legal deeded access/easement.')}else{fv('road',R.road.d<150?1:0.6,`road ${fmtMi(R.road.d)} away`);pros.push(`Road access: ${esc(R.road.name||R.road.tags.highway)} ${fmtMi(R.road.d)} away`)}
 if(R.flood==null){F.flood=null;warn.push('FEMA flood zone unknown (NFHL unreachable)')}else{const z=R.flood.FLD_ZONE;if(/^(A|V)/.test(z)){fv('flood',-1,`FEMA zone ${z}`);warn.push(`<b>FEMA Special Flood Hazard Area: zone ${esc(z)}</b> – flood insurance likely required`)}else if(z==='none mapped'){F.flood=null;cons.push('No FEMA flood map at this point (unmapped ≠ safe)')}else{fv('flood',0.6,`FEMA zone ${z}`);pros.push(`FEMA flood zone ${esc(z)} ${esc(R.flood.ZONE_SUBTY||'')}`)}}
 F.fire=null; // no free point API; user checks wildfirerisk.org
 if(R.slope==null)F.slope=null;else if(R.slope>30){fv('slope',-1,`very steep ${R.slope}%`);cons.push(`Very steep (${R.slope}%) – hard to build`)}else if(R.slope<15){fv('slope',R.slope<8?1:0.5,`slope ${R.slope}%`);pros.push(`Buildable slope (${R.slope}%)`)}else{fv('slope',-0.3,`moderate slope ${R.slope}%`);cons.push(`Moderate slope (${R.slope}%) – grading likely`)}
 if(R.hosp!==undefined){if(!R.hosp||mi(R.hosp.d)>40){fv('hospital',-1,'hospital >40 mi');warn.push('Nearest hospital '+(R.hosp?fmtMi(R.hosp.d)+' ('+esc(R.hosp.name)+')':'> 50 mi')+' – plan for emergencies')}else{fv('hospital',mi(R.hosp.d)<15?1:0.3,`hospital ${fmtMi(R.hosp.d)}`);pros.push(`Hospital: ${esc(R.hosp.name)} ${fmtMi(R.hosp.d)}`)}}else{F.hospital=null;warn.push('Hospital distance unknown')}
 if(R.fuel!==undefined)(R.fuel?(mi(R.fuel.d)>25?cons:pros):cons).push(R.fuel?`Fuel: ${esc(R.fuel.name||'station')} ${fmtMi(R.fuel.d)}`:'No fuel station within 25 mi');
 if(R.power!==undefined){if(R.power&&mi(R.power.d)<0.5){fv('power',1,`power line ${fmtMi(R.power.d)}`);pros.push(`Power line ${fmtMi(R.power.d)} away (mapped in OSM)`)}else{fv('power',-0.5,'no power line mapped within ½ mi');cons.push('No power line mapped within '+(R.power?fmtMi(R.power.d):'~2 mi')+' – consider solar/generator; small lines often unmapped')}}else{F.power=null;cons.push('Power distance unknown')}
 // water
 const W=R.water;if(!W||!W.ok){F.water=null;cons.push('Surface water unknown (OSM unreachable)')}else{const s=W.surf[0],a=W.access[0];let v=0,why=[];
  if(s&&s.d<30){v=1;why.push('water on/at the spot');pros.push(`Water on/at this spot: ${esc(s.name||s.kind)}`)}else if(s&&s.d<1609){v=0.7;why.push(`water ${fmtMi(s.d)}`);pros.push(`Surface water ${fmtMi(s.d)} away: ${esc(s.name||'unnamed')} (${esc(s.kind)})`)}else{v=-0.6;why.push('no surface water within 1 mi');cons.push('No surface water mapped within ~1 mi'+(s?` (nearest ${esc(s.name||s.kind)} ${fmtMi(s.d)})`:''))}
  if(a&&a.d<8000){v+=0.2;why.push(`${a.kind} ${fmtMi(a.d)}`);pros.push(`Public ${esc(a.kind)} ${fmtMi(a.d)} away${a.name?': '+esc(a.name):''}`)}
  if(W.wells)v+=0.1;fv('water',v,why.join(', '))}
 if(R.wells==null)cons.push('Wells: unknown (USGS NWIS unreachable)');else if(R.wells>0)pros.push(`${R.wells} USGS groundwater sites within ~3 mi (groundwater exists in area)`);else cons.push('No USGS groundwater sites within ~3 mi – check state well logs');
 warn.push('Irrigation/water rights: <i>unknown</i> (no national data) – check the state water-rights agency.');
 const noise=[R.hwy&&`highway ${esc(R.hwy.name)} ${fmtMi(R.hwy.d)}`,R.air&&`airport/airstrip ${esc(R.air.name)} ${fmtMi(R.air.d)}`,R.range&&`shooting range ${esc(R.range.name)} ${fmtMi(R.range.d)}`].filter(Boolean);
 if(R.ovOK){if(noise.length){fv('noise',-0.4*noise.length,`${noise.length} noise source(s)`);cons.push('Noise sources: '+noise.join('; '))}else{fv('noise',0.8,'no highways/airports/ranges nearby');pros.push('No highways (5 mi), airports (6 mi) or ranges (5 mi) mapped nearby')}}else F.noise=null;
 const C=computeScore(F);return{score:Math.max(0,Math.min(100,C.score)),pros,cons,warn,parts:C.parts,F}}
const _repCache=new Map();
function getReport(lon,lat){const k=lon.toFixed(5)+','+lat.toFixed(5);if(!_repCache.has(k)){const p=gatherReport(lon,lat);_repCache.set(k,p);p.catch(()=>_repCache.delete(k))}return _repCache.get(k)}

    else if(L.k==='game'){a.el.dataset.n=grp.length}}
   reps.push(a)})});
 // 2) density cap per 120px cell + collision yield (higher priority placed first)
 reps.sort((a,b)=>b.pr-a.pr);const placed=[],cell=new Map();let more=0;const CAP=3;
 reps.forEach(it=>{const r=it.el.getBoundingClientRect();const box={l:r.left,t:r.top,r:r.right,b:r.bottom};const ck=Math.floor(it.x/120)+'_'+Math.floor(it.y/120);const n=cell.get(ck)||0;
  const hit=placed.some(p=>Math.min(box.r,p.r)-Math.max(box.l,p.l)>6&&Math.min(box.b,p.b)-Math.max(box.t,p.t)>6);
  if(hit||n>=CAP){it.el.classList.add('yield');more++}else{placed.push(box);cell.set(ck,n+1)}});
 renderLegend(more)}
function scheduleDeclutter(){clearTimeout(declTimer);declTimer=setTimeout(()=>requestAnimationFrame(declutter),60)}
map.on('moveend',scheduleDeclutter);
try{new MutationObserver(scheduleDeclutter).observe(map.getCanvasContainer().parentElement,{childList:true,subtree:false})}catch(e){}
function renderLegend(more){let lg=$('#legend');if(!lg){lg=document.createElement('div');lg.id='legend';document.body.appendChild(lg)}
 const act=activeLayers();lg.classList.toggle('hidden',!act.length);
 lg.innerHTML=act.map(l=>`<button data-lg="${l.k}" class="${focusLayer===l.k?'on':''} ${soloLayer===l.k?'solo':''}">${l.n}</button>`).join('')+(more?`<span class="more">+${more} more</span>`:'');
 lg.querySelectorAll('[data-lg]').forEach(b=>{let t=null,long=false;const k=b.dataset.lg;
  b.addEventListener('pointerdown',()=>{long=false;t=setTimeout(()=>{long=true;window.__lgLong=true;soloLayer=soloLayer===k?null:k;try{navigator.vibrate&&navigator.vibrate(20)}catch(e){}declutter()},500)});
  b.addEventListener('pointerup',()=>{clearTimeout(t);if(window.__lgLong){window.__lgLong=false;return}if(!long){soloLayer=null;setFocus(focusLayer===k?null:k)}});b.addEventListener('pointerleave',()=>clearTimeout(t))})}
// focus follows most recent toggle/tap
['btnGame','btnSale'].forEach(id=>$('#'+id).addEventListener('click',()=>setFocus(id==='btnGame'?'game':'listings')));
document.addEventListener('click',e=>{const m=e.target.closest('.lpin,.gamepin,.fishpin');if(m){const k=m.classList.contains('lpin')?(m.classList.contains('deal')?'deals':'listings'):m.classList.contains('gamepin')?'game':'fish';if(focusLayer!==k){focusLayer=k;scheduleDeclutter()}}},true);

/* ================= Theme: dark / light / auto ================= */
settings.theme=settings.theme||'auto';
const _cv=document.createElement('canvas').getContext('2d');
function toHsl(c){_cv.fillStyle='#000';_cv.fillStyle=c;let h=_cv.fillStyle;let r,g,b,a=1;if(h[0]==='#'){r=parseInt(h.slice(1,3),16);g=parseInt(h.slice(3,5),16);b=parseInt(h.slice(5,7),16)}else{const m=h.match(/[\d.]+/g);if(!m)return null;[r,g,b]=m.map(Number);a=m[3]!=null?+m[3]:1}
 r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let H=0,S=0,L=(mx+mn)/2;if(mx!==mn){const d=mx-mn;S=L>.5?d/(2-mx-mn):d/(mx+mn);H=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;H*=60}return{H,S,L,a}}
function darkOf(c,isText){const h=toHsl(c);if(!h)return c;const L=isText?Math.max(.75,1-h.L*.6):Math.max(.06,Math.min(.42,(1-h.L)*.55+.06));return`hsla(${h.H.toFixed(0)},${(h.S*70).toFixed(0)}%,${(L*100).toFixed(0)}%,${h.a})`}
let _origPaint=null;
function isDark(){return settings.theme==='dark'||(settings.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches)}
function applyTheme(){const dark=isDark();document.documentElement.classList.toggle('light',!dark);document.documentElement.classList.toggle('dark',dark);
 const tm=document.querySelector('meta[name=theme-color]');if(tm)tm.content=dark?'#15191c':'#f4f5f2';
 if(!map.isStyleLoaded()&&!map.loaded())return;const st=map.getStyle();if(!st)return;
 if(!dark&&!_origPaint){document.querySelectorAll('[data-theme-sel]').forEach(s=>s.value=settings.theme);return}
 if(!_origPaint){_origPaint={};st.layers.forEach(l=>{const props={background:['background-color'],fill:['fill-color','fill-outline-color'],line:['line-color'],'fill-extrusion':['fill-extrusion-color'],symbol:['text-color','text-halo-color']}[l.type]||[];props.forEach(p=>{const v=map.getPaintProperty(l.id,p);if(typeof v==='string')(_origPaint[l.id]=_origPaint[l.id]||{})[p]=v})})}
 Object.entries(_origPaint).forEach(([id,ps])=>{if(!map.getLayer(id))return;Object.entries(ps).forEach(([p,v])=>{let nv=v;
  if(dark){if(p==='text-halo-color')nv='#111';else if(p==='text-color')nv=darkOf(v,true);else if(!/^hf-|^draw|^sketch/.test(id))nv=darkOf(v,false)}
  try{map.setPaintProperty(id,p,nv)}catch(e){}})});
 map.getStyle().layers.filter(l=>l.type==='symbol').forEach(l=>{try{map.setPaintProperty(l.id,'text-halo-color',dark?'#111':'#fff');if(dark&&!(_origPaint[l.id]||{})['text-color'])map.setPaintProperty(l.id,'text-color','#e8e8e8')}catch(e){}});
 document.querySelectorAll('[data-theme-sel]').forEach(s=>s.value=settings.theme)}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>settings.theme==='auto'&&applyTheme());
map.on('load',()=>setTimeout(applyTheme,50));applyTheme();
function setTheme(v){settings.theme=v;saveSettings();applyTheme()}
(()=>{const p=$('#settings .panel');if(p&&!$('#sTheme')){p.insertAdjacentHTML('afterbegin',`<label>Appearance <select id="sTheme" data-theme-sel style="padding:8px;font-size:16px"><option value="auto">Auto (system)</option><option value="dark">Dark</option><option value="light">Light</option></select></label>`);$('#sTheme').value=settings.theme;$('#sTheme').onchange=e=>setTheme(e.target.value)}})();

settings.landGame=settings.landGame!==false;settings.fish=settings.fish!==false;
function showHome(){let h=$('#home');if(h)h.remove();h=document.createElement('div');h.id='home';const key=!!settings.rcKey;
 h.innerHTML=`<div class="hwrap"><div class="hlogo">🏕 Homestead Finder</div>
 <h1>Know the land before you drive out.</h1>
 <p class="hlead"><b>The Getaway Report</b> scores any spot for a hunting getaway in seconds: public land, verified game & fish, water, access, flood, power – weighted by <b>your</b> priorities.</p>

 <div class="hrowb"><button id="hPrio">⚖️ My Priorities</button><button id="hShort">⭐ Shortlist</button><button id="hRecent">🕘 Recent</button></div>
 <label class="htheme">Appearance <select id="hTheme" data-theme-sel><option value="auto">Auto</option><option value="dark">Dark</option><option value="light">Light</option></select></label>
 <button id="hOpen">Open Map</button></div>`;
 document.body.appendChild(h);
 $('#hState').value=settings.state||'';$('#hMode').value=settings.mode||'sale';$('#hLand').checked=gameOn&&settings.landGame;$('#hFish').checked=gameOn&&settings.fish;$('#hTheme').value=settings.theme;
 if(key){$('#hSale').checked=saleOn;$('#hDeals').checked=dealsOnly}
 let ht=typeFilter;const chips=()=>h.querySelectorAll('[data-ht]').forEach(b=>b.classList.toggle('on',b.dataset.ht===ht));chips();
 h.querySelectorAll('[data-ht]').forEach(b=>b.onclick=()=>{ht=b.dataset.ht;chips()});
 $('#hTheme').onchange=e=>setTheme(e.target.value);
 const save=()=>{settings.state=$('#hState').value;settings.mode=$('#hMode').value;const hl=$('#hLand').checked,hf=$('#hFish').checked;gameOn=hl||hf;if(gameOn){settings.landGame=hl;settings.fish=hf}else{settings.landGame=true;settings.fish=true}
 settings.game=gameOn;if(key){saleOn=$('#hSale').checked||$('#hDeals').checked;settings.sale=saleOn;dealsOnly=$('#hDeals').checked;settings.dealsOnly=dealsOnly}
  typeFilter=ht;settings.typeFilter=ht;saveSettings();DB.put('cache',{id:'home-selections',t:Date.now(),data:{...settings,rcKey:undefined}}).catch(()=>{})};
 const go=()=>{save();h.remove();$('#state').value=settings.state;$('#mode').value=settings.mode;$('#btnGame').classList.toggle('on',gameOn);$('#btnSale').classList.toggle('on',saleOn);
  const s=STATES.find(x=>x[0]===settings.state);if(s)map.jumpTo({center:[s[3],s[2]],zoom:Math.max(s[4],8.2),pitch:0});
  setTimeout(()=>{refreshListings();updateGame();renderSalePins()},300)};
 $('#hOpen').onclick=go;
 $('#hPrio').onclick=()=>{save();h.remove();openPriorities()};$('#hShort').onclick=()=>{save();h.remove();openShortlist()};$('#hRecent').onclick=()=>{save();h.remove();openRecent()}}
(()=>{const b=document.createElement('button');b.id='btnHome';b.title='Home';b.textContent='⌂';$('#fabs').prepend(b);b.onclick=showHome})();

showHome();
